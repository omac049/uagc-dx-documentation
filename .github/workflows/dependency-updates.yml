name: Automated Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of updates to perform'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - all

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "dependency-updates"
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest

    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      update_summary: ${{ steps.check.outputs.summary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Check for outdated dependencies
        id: check
        run: |
          UPDATE_TYPE="${{ github.event.inputs.update_type || 'patch' }}"

          case $UPDATE_TYPE in
            "patch") NCU_OPTIONS="--target patch" ;;
            "minor") NCU_OPTIONS="--target minor" ;;
            "all")   NCU_OPTIONS="" ;;
          esac

          UPDATES=$(ncu $NCU_OPTIONS 2>&1) || true

          if echo "$UPDATES" | grep -q "→"; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            SUMMARY=$(echo "$UPDATES" | grep "→" | head -20)
            echo "summary<<EOF" >> $GITHUB_OUTPUT
            echo "$SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "summary=No updates available" >> $GITHUB_OUTPUT
          fi

  apply-updates:
    name: Apply Updates
    runs-on: ubuntu-latest
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'

    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
      branch_name: ${{ steps.branch.outputs.branch_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm-check-updates
        run: npm install -g npm-check-updates

      - name: Determine branch name
        id: branch
        run: |
          UPDATE_TYPE="${{ github.event.inputs.update_type || 'patch' }}"
          case $UPDATE_TYPE in
            "patch") BRANCH_NAME="deps/automated-patch" ;;
            "minor") BRANCH_NAME="deps/automated-minor" ;;
            "all")   BRANCH_NAME="deps/automated-major" ;;
          esac
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Apply updates
        run: |
          UPDATE_TYPE="${{ github.event.inputs.update_type || 'patch' }}"

          case $UPDATE_TYPE in
            "patch") NCU_OPTIONS="--target patch" ;;
            "minor") NCU_OPTIONS="--target minor" ;;
            "all")   NCU_OPTIONS="" ;;
          esac

          ncu $NCU_OPTIONS -u
          npm install

      - name: Verify overrides preserved
        run: |
          node -e "
            const pkg = require('./package.json');
            const overrides = pkg.overrides || {};
            const required = ['fast-uri', 'postcss', 'brace-expansion', 'dompurify'];
            const missing = required.filter(k => !overrides[k]);
            if (missing.length) {
              console.error('Security overrides missing after ncu:', missing);
              process.exit(1);
            }
            console.log('Security overrides intact:', Object.keys(overrides).join(', '));
          "

      - name: Test build
        run: |
          npx docusaurus --version
          npm run build

      - name: Create branch and commit
        id: commit
        run: |
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -B "$BRANCH_NAME"
          git add package*.json

          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            UPDATE_TYPE="${{ github.event.inputs.update_type || 'patch' }}"
            git commit -m "Automated dependency updates ($UPDATE_TYPE)"
            git push --force-with-lease origin "$BRANCH_NAME"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    needs: [check-updates, apply-updates]
    if: needs.apply-updates.outputs.has_changes == 'true'

    steps:
      - name: Create or update pull request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const updateType = '${{ github.event.inputs.update_type || 'patch' }}';
            const branchName = '${{ needs.apply-updates.outputs.branch_name }}';
            const summary = `${{ needs.check-updates.outputs.update_summary }}`;

            const typeDesc = {
              patch: 'bug fixes only',
              minor: 'new features + bug fixes',
              all: 'all available updates'
            };

            const body = [
              '## Automated Dependency Updates',
              '',
              '### Updates Applied',
              '```',
              summary,
              '```',
              '',
              '### Validation',
              '- Dependencies installed successfully',
              '- Security overrides verified intact',
              '- Docusaurus configuration validated',
              '- Site build completed successfully',
              '',
              `**Update Type:** ${updateType} (${typeDesc[updateType] || updateType})`,
              '',
              '---',
              `*Auto-generated on ${new Date().toISOString().split('T')[0]}*`
            ].join('\n');

            const title = `Dependency updates (${updateType})`;

            // Check for an existing open PR from this branch
            const { data: existingPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branchName}`,
            });

            if (existingPRs.length > 0) {
              const pr = existingPRs[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title,
                body,
              });
              console.log(`Updated existing PR #${pr.number}: ${pr.html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: branchName,
              base: 'main',
              body,
            });

            console.log(`Created PR #${pr.number}: ${pr.html_url}`);

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['dependencies', 'automated'],
              });
            } catch (e) {
              console.log('Could not add labels:', e.message);
            }
